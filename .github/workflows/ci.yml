name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  linux:
    name: Linux workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Native GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libgl1-mesa-dev libudev-dev
      - name: Pinned Rust toolchain
        run: rustup show
      - name: Verify committed dependency resolution
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy, including the GUI
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit and integration tests
        run: cargo test --workspace --locked
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: CLI smoke test
        run: |
          cargo run --locked -p avila-cli -- --config config/default.toml check-config
          cargo run --locked -p avila-cli -- inspect --json

  reproducible:
    name: Reproducible release build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Pinned Rust toolchain
        run: rustup show
      - name: Build the release binary twice, independently
        run: |
          CARGO_TARGET_DIR=tg1 cargo build --release -p avila-cli --locked
          CARGO_TARGET_DIR=tg2 cargo build --release -p avila-cli --locked
      - name: Compare hashes
        run: |
          a=$(sha256sum tg1/release/avila-node | cut -d' ' -f1)
          b=$(sha256sum tg2/release/avila-node | cut -d' ' -f1)
          test "$a" = "$b"
          echo "reproducible: $a"
      - name: Dependency/license inventory
        run: |
          cargo tree --locked --prefix none -e normal | sort -u > dep-inventory.txt
          cat dep-inventory.txt
