[workspace]
resolver = "3"
members = [
    "crates/avila-core",
    "crates/avila-consensus",
    "crates/avila-mempool",
    "crates/avila-node",
    "crates/avila-p2p",
    "crates/avila-cli",
    "crates/avila-gui",
]
default-members = ["crates/avila-cli"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Connor Avila"]
repository = "https://github.com/Connoravila1/Avila-Node"
publish = false

[workspace.dependencies]
libc = "0.2"
prctl = "1.0"
avila-core = { path = "crates/avila-core" }
avila-consensus = { path = "crates/avila-consensus" }
avila-mempool = { path = "crates/avila-mempool" }
avila-node = { path = "crates/avila-node" }
avila-p2p = { path = "crates/avila-p2p" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
# `arbitrary_precision` keeps a number's literal text inside Value —
# the wait/stats RPCs emit Core's `%.16g` float text verbatim, which
# doesn't always round-trip through serde's ryu formatting.
# `preserve_order` (IndexMap) keeps object key order — UniValue also
# preserves insertion order, and createrawtransaction's dict-form
# outputs serialize in the caller's key order.
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }
signal-hook = "0.3.17"
thiserror = "2.0"
# Embedded coins database — the disk backend for the coins view.
redb = "=4.3.0"
sha2 = { version = "0.11", default-features = false }
ripemd = { version = "0.2", default-features = false }
sha1 = { version = "0.11", default-features = false }
# Rust bindings to libsecp256k1 — the same C library Bitcoin Core links for
# consensus signature verification, chosen so DER-parsing and verification
# edge cases match the reference implementation.
secp256k1 = { version = "0.29", default-features = false, features = ["alloc", "recovery"] }
# Development-only differential references for the consensus crate.
bitcoin = { version = "0.32", default-features = false, features = ["std"] }
proptest = { version = "1.11", default-features = false, features = ["std"] }
toml = "1.1"
# Native GUI only. Persistence is limited by the app to appearance preferences.
eframe = { version = "=0.36.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
egui_extras = { version = "=0.36.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
debug = 1
