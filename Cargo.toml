[workspace]
resolver = "3"
members = [
    "crates/avila-core",
    "crates/avila-consensus",
    "crates/avila-node",
    "crates/avila-cli",
    "crates/avila-gui",
]
default-members = ["crates/avila-cli"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Connor Avila"]
repository = "https://github.com/Connoravila1/Avila-Node"
publish = false

[workspace.dependencies]
avila-core = { path = "crates/avila-core" }
avila-consensus = { path = "crates/avila-consensus" }
avila-node = { path = "crates/avila-node" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = { version = "0.11", default-features = false }
ripemd = { version = "0.2", default-features = false }
sha1 = { version = "0.11", default-features = false }
# Rust bindings to libsecp256k1 — the same C library Bitcoin Core links for
# consensus signature verification, chosen so DER-parsing and verification
# edge cases match the reference implementation.
secp256k1 = { version = "0.29", default-features = false, features = ["alloc"] }
# Development-only differential references for the consensus crate.
bitcoin = { version = "0.32", default-features = false, features = ["std"] }
proptest = { version = "1.11", default-features = false, features = ["std"] }
toml = "1.1"
# Native GUI only. Persistence is limited by the app to appearance preferences.
eframe = { version = "=0.36.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
egui_extras = { version = "=0.36.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
debug = 1
