# Development configuration. Network selection is not yet network support.
# Mainnet, testnet4, signet, and regtest are recognized configuration values.
schema_version = 1
network = "regtest"
# Relative to this configuration file, NOT the current working directory.
# The selected network is appended, e.g. ../data/regtest.
data_dir = "../data"

# Operator policy lives under the namespaces of docs/DECISION_REGISTRY.md.
# Every value shown below is the shipped default — uncommenting changes it.
#
# A sibling file "<name>.runtime.toml" is merged over this one at load —
# that's where GUI edits land, so this file is never rewritten by the app.
# The GUI may write `_unset = ["privacy.proxy"]` in that overlay to
# explicitly disable an optional value supplied by this base file.

[diag]
event_capacity = 256

# [storage]
# prune_mb = 550                      # Core's -prune; absent = archival
# dbcache_mb = 450                    # Core's -dbcache

# [net]
# v2transport = true                  # Core's -v2transport (BIP324 outbound)
# connect = ["1.2.3.4:8333"]          # Core's -connect; suppresses DNS seeding
# listen = "0.0.0.0:8333"             # Core's -listen=<addr>; absent = outbound-only
# asmap = "asmap.txt"                 # Core's -asmap; relative to this file
# dns_seeds = true                    # Core's -dnsseed
# blocks_only = false                 # Core's -blocksonly — no tx relay
                                     # at all: no announces, no
                                     # inv-triggered fetches, no mempool
                                     # dumps, no recon, no rebroadcast.
                                     # Mempool still serves the wallet.

# [peers]
# max_connections = 8                 # Core's -maxconnections
# ban_time = 86400                    # default setban duration, seconds
                                     # (Core's -bantime)

# [privacy]
# proxy = "127.0.0.1:9050"            # Core's -proxy (SOCKS5)
# cell_bytes = 0                      # pad v2 writes to this multiple; 0 = off

# [mempool]
# max_mb = 300                        # Core's -maxmempool
# min_relay_fee_sat_per_kvb = 100     # Core's -minrelaytxfee (0.1 sat/vB floor)
# expiry_secs = 1209600               # Core's -mempoolexpiry (336h)
# private = false                     # local submissions: stem-only relay,
                                     # hidden from getrawmempool/
                                     # getmempoolentry. Full validation
                                     # unchanged — only propagation and
                                     # listing differ.

# [policy]
# require_standard = true             # Core's -acceptnonstdtxn, negated
# datacarrier = true                  # Core's -datacarrier
# datacarrier_size = 100000           # Core's -datacarriersize (MAX_OP_RETURN_RELAY)
# permit_bare_multisig = true         # Core's -permitbaremultisig
# dust_relay_fee_sat_per_kvb = 3000   # Core's -dustrelayfee
# shadow = ["strict"]                 # counterfactual policies scored on live
                                    # admissions — strict | core | permissive;
                                    # divergence counts land in getmempoolinfo
                                    # and shadow_divergence events. [] = off

# [relay.tx]
# stem = true                         # stem-hop announce for local transactions
# deny_pairs = []                     # compartment matrix: "src->dst" pairs
                                     # never announced across.
                                     # src: inbound|outbound|local|extrapool
                                     # dst: inbound|outbound
                                     # e.g. ["inbound->inbound",
                                     #       "extrapool->inbound"]
# announce = "all"                    # tx fan-out: all | private_only
                                     # (mempool.private entries only) |
                                     # none (announce nothing)
# to_inbound = true                   # announce txs onto inbound links
# to_blocks_only_peers = false        # announce to peers whose version
                                     # said relay=false (overrides them)
# send_feefilter = 0                  # advertise our mempool floor
                                     # (sat/kvB) to peers; 0 = silent
                                     # like Core
# rebroadcast_local = true            # retry local txs until they
                                     # confirm (Core's -walletbroadcast)
# rebroadcast_interval = 60           # seconds between retry passes

# External verdict helpers — docs/DECISION_REGISTRY.md. Each
# [[hooks.peer_accept]] is a long-lived subprocess: the node writes
# {"point","seq","facts"} on stdin and reads {"verdict":"accept"|
# "reject"|"defer"} on stdout. Helpers can only NARROW acceptance —
# they can refuse a peer, never override bans, slots, or consensus.
# Consulted on inbound admission after the ban check.
# [[hooks.peer_accept]]
# program = "/usr/local/sbin/accept-peer"  # relative → config file's dir
# args = ["--strict"]
# timeout_ms = 500          # slow = dead; killed and restarted
# on_timeout = "reject"     # dead helper's verdict — fail-closed
# on_defer = "reject"       # what a "defer" answer means
# max_restarts = 3          # exhausted → on_timeout forever
#
# [[hooks.tx_admit]] — same protocol, consulted on EVERY transaction
# submission before the built-in mempool checks (narrowing only).
# Facts: txid, wtxid, version, lock_time, vbytes, weight, inputs,
# outputs, output_value, fee, feerate (sat/kvB), rbf, has_witness,
# spk_types. fee/feerate are null when a prevout doesn't resolve.
# Hot path: admission throughput is bounded by helper latency.
# [[hooks.tx_admit]]
# program = "/usr/local/sbin/admit-tx"
# args = []
# timeout_ms = 500
# on_timeout = "reject"     # dead helper rejects all txs — fail-closed
# on_defer = "reject"
# max_restarts = 3
#
# [[hooks.tx_announce]] — same protocol, consulted per (tx, target
# link) before each inv hop — including the stem hop and extrapool
# propagation. A "reject" withholds that link only.
# Facts: txid, wtxid, source (inbound|outbound|local|extrapool),
# source_peer, peer, peer_addr, peer_inbound, peer_user_agent.
# The hottest path: announce throughput = helper latency × peers.
# [[hooks.tx_announce]]
# program = "/usr/local/sbin/announce-tx"
# args = []
# timeout_ms = 100
# on_timeout = "reject"     # dead helper silences relay — fail-closed
# on_defer = "reject"
# max_restarts = 3
#
# [[hooks.extrapool_admit]] / [[hooks.extrapool_promote]] — gate the
# observation pool's store and re-admission. Facts: txid, reason.
#
# [[hooks.tx_serve]] — consulted per tx item in a peer's getdata;
# a "reject" answers notfound, indistinguishable from never holding
# it. Facts: txid, wtxid, peer, peer_addr, peer_inbound,
# peer_user_agent. Non-tx requests bypass the hook.
# [[hooks.tx_serve]]
# program = "/usr/local/sbin/serve-tx"
# args = []
# timeout_ms = 100
# on_timeout = "reject"     # dead helper withholds all txs — fail-closed
# on_defer = "reject"
# max_restarts = 3

# [extrapool]
# The observation pool: consensus-valid transactions that live policy
# refused get stored here (bounded, inspectable) instead of dropped —
# "what is my node filtering, and could I promote it back?"
# observe = true                      # record policy rejects
# max_entries = 10000                 # FIFO eviction past this
# max_bytes = 50000000                # serialized-bytes cap, ~50 MiB
# expiry_secs = 86400                 # entry lifetime; 0 = never age out
# relay = "never"                     # propagate observed txs —
                                     # never|outbound|all. "outbound"
                                     # confines to our chosen links.
                                     # tx.announce still gates each hop.
# promote_on = []                     # auto re-admission triggers:
                                     # ["tip"] retries all entries on
                                     # each connected block (full
                                     # validation, bounded per tip).

# [extrapool.caps]                    # per-reject-class entry caps —
                                     # the oldest of a class evicts when
                                     # it exceeds its cap. Classes:
                                     # nonstandard fee hook rbf package
                                     # finality capacity weight sigops
                                     # truc other
#   fee = 4000

# [mining]
# include_extrapool = false           # mine what you won't relay —
                                     # extrapool entries audition for a
                                     # template's leftover budget, each
                                     # fully revalidated under consensus
                                     # rules (never trusted from the
                                     # record). Inputs must be confirmed
                                     # on-chain; conflicts with chosen
                                     # pool txs are skipped. At most 512
                                     # entries audition per template.
# max_weight = 4000000                # template weight cap — Core's
                                     # -blockmaxweight; clamps to the
                                     # consensus bound, never beyond
# min_tx_fee = 0                      # package floor (sat/kvB) — Core's
                                     # -blockmintxfee
# reserved_weight = 8000              # coinbase/commitment budget — Core's
                                     # -blockreservedweight (≥2000)

# [relay.block]
# compact = true                      # BIP152 sendcmpct/cmpctblock
# compact_high_bandwidth = true       # ask peers for hb cmpctblock
# compact_serve = true                # honor peers' hb asks (≤3 links)
                                     # and answer getblocktxn
# announce = ""                       # tip announce: "" = peer's
                                     # negotiated preference;
                                     # headers | inv | none override
# serve = "full"                      # block bodies: full | tip
                                     # (checked tip ± reorg slack) |
                                     # none (notfound everything)

# [[hooks.block_serve]] — consulted per block item in getdata and on
# each getblocktxn; "reject" answers notfound. Facts: block_hash,
# peer, peer_addr, peer_inbound, peer_user_agent.
# [[hooks.block_serve]]
# program = "/usr/local/sbin/serve-block"
# timeout_ms = 100
# on_timeout = "reject"
# on_defer = "reject"
# max_restarts = 3
#
# [[hooks.template_build]] — veto assembled block templates.
# Facts: height, tx_count, weight, sigops, fees.
# [[hooks.template_build]]
# program = "/usr/local/sbin/veto-template"
# timeout_ms = 1000
# on_timeout = "accept"
# on_defer = "accept"
# max_restarts = 3

# [filters]
# build = false                       # Core's -blockfilterindex
# serve = false                       # Core's -peerblockfilters (requires build)

# [indexes]
# txindex = false                     # Core's -txindex

# [sync]
# max_in_transit = 1024               # total blocks-in-flight budget
# utreexo = false                     # accumulator shadow validation
# utreexo_bridge = false              # serve utxproof spend bundles

# [services.rpc]
# bind = "127.0.0.1:18443"            # absent = RPC off; cookie auth still applies
# user = "alice"                      # requires password
# password = "…"
# whitelist = ["alice:getbalance,getblockcount"]
# whitelist_default = true

# [services.electrum]
# listen = "127.0.0.1:50001"          # maintains the scripthash index

# [services.sv2]
# listen = "127.0.0.1:55001"          # Stratum V2 Template Provider (loopback only)
