[package]
name = "avila-cli"
description = "Headless executable for Avila Node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "avila-node"
path = "src/main.rs"
# The library owns the avila_node rustdoc path; CLI usage is exposed by --help.
doc = false

[dependencies]
avila-consensus.workspace = true
avila-core.workspace = true
avila-node.workspace = true
clap.workspace = true
libc = "0.2"
seccompiler = "0.4.0"
serde_json.workspace = true
signal-hook.workspace = true

[lints]
workspace = true
