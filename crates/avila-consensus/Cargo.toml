[package]
name = "avila-consensus"
description = "Independent, pure Bitcoin consensus primitives for Avila Node: bounded decoding, hashing, target arithmetic, proof of work and header-chain validation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The only trusted third-party code in the validation path: the RustCrypto
# hashes (SHA-2 for txids/sighash, SHA-1 and RIPEMD-160 for legacy opcodes)
# and libsecp256k1 for ECDSA/Schnorr verification — the same library Bitcoin
# Core links for consensus signatures.
sha2.workspace = true
sha1.workspace = true
ripemd.workspace = true
secp256k1.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Differential references only. Neither crate is used by the validation path.
bitcoin.workspace = true
proptest.workspace = true

[lints]
workspace = true
